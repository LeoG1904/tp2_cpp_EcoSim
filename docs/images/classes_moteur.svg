ne x1="400" y1="304" x2="710" y2="304" stroke="#3b4a5a"/><text x="410" y="323" class="member">identifiant, âge, énergie</text><text x="410" y="341" class="member">position, direction, trajet</text><text x="410" y="359" class="member">traits : AnimalTraits</text><text x="410" y="377" class="member">Advance()</text><text x="410" y="395" class="member">Steer()  (abstraite)</text><text x="410" y="413" class="member">Act()  (abstraite)</text><rect x="820" y="270" width="240" height="76" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4"/><rect x="821" y="271" width="238" height="29" rx="4" fill="#dbe7f3"/><text x="940.0" y="290" class="name">PopulationSample</text><line x1="820" y1="300" x2="1060" y2="300" stroke="#3b4a5a"/><text x="830" y="319" class="member">effectifs, herbe</text><text x="830" y="337" class="member">énergie, événements</text><rect x="40" y="480" width="250" height="76" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4"/><rect x="41" y="481" width="248" height="29" rx="4" fill="#dbe7f3"/><text x="165.0" y="500" class="name">Cell</text><line x1="40" y1="510" x2="290" y2="510" stroke="#3b4a5a"/><text x="50" y="529" class="member">terrain</text><text x="50" y="547" class="member">herbe de 0 à 100</text><rect x="330" y="530" width="200" height="76" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4"/><rect x="331" y="531" width="198" height="29" rx="4" fill="#dbe7f3"/><text x="430.0" y="550" class="name">Herbivore</text><line x1="330" y1="560" x2="530" y2="560" stroke="#3b4a5a"/><text x="340" y="579" class="member">broute</text><text x="340" y="597" class="member">peut fuir</text><rect x="580" y="530" width="200" height="76" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4"/><rect x="581" y="531" width="198" height="29" rx="4" fill="#dbe7f3"/><text x="680.0" y="550" class="name">Predator</text><line x1="580" y1="560" x2="780" y2="560" stroke="#3b4a5a"/><text x="590" y="579" class="member">chasse</text><text x="590" y="597" class="member">peut chasser en meute</text><rect x="820" y="460" width="240" height="108" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4"/><rect x="821" y="461" width="238" height="43" rx="4" fill="#e9defa"/><text x="940.0" y="477" class="stereo">«interface»</text><text x="940.0" y="494" class="name abstract">Habitat</text><line x1="820" y1="504" x2="1060" y2="504" stroke="#3b4a5a"/><text x="830" y="523" class="member">NearestPrey()</text><text x="830" y="541" class="member">HuntersNear()</text><text x="830" y="559" class="member">CatchPrey(), ShareMeal()</text><rect x="820" y="660" width="240" height="90" rx="5" fill="#ffffff" stroke="#3b4a5a" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="821" y="661" width="238" height="43" rx="4" fill="#eceff2"/><text x="940.0" y="677" class="stereo">«interne à Simulation»</text><text x="940.0" y="694" class="name">GridHabitat</text><line x1="820" y1="704" x2="1060" y2="704" stroke="#3b4a5a"/><text x="830" y="723" class="member">animaux rangés par case</text><text x="830" y="741" class="member">créé à chaque génération</text><text x="24" y="783" class="legendtitle">Légende</text>
